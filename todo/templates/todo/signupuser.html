{% extends "todo/base.html" %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">

        <div class="card shadow-lg border-0"
             style="background: rgba(255,255,255,0.15);
                    backdrop-filter: blur(10px);
                    border-radius:20px;
                    color:white;">

            <div class="card-body p-5">

                <h2 class="text-center font-weight-bold mb-2">
                    🚀 Join <span class="text-warning">Tick Do</span>
                </h2>

                <p class="text-center mb-4">
                    Organize smarter, stay productive, and never miss an important task.
                </p>

                {% if error %}
                <div class="alert alert-danger text-center">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label><strong>Username</strong></label>
                        <input type="text"
                               name="username"
                               class="form-control"
                               placeholder="Choose a unique username">

                        <small class="form-text text-light">
                            Pick a unique username to create your account.
                        </small>
                    </div>

                    <div class="form-group">
                        <label><strong>Password</strong></label>
                        <input type="password"
                               name="password1"
                               class="form-control"
                               placeholder="Create a strong password">
                    </div>

                    <div class="form-group">
                        <label><strong>Confirm Password</strong></label>
                        <input type="password"
                               name="password2"
                               class="form-control"
                               placeholder="Re-enter your password">
                    </div>

                    <button class="btn btn-warning btn-block font-weight-bold py-2">
                        ✨ Create My Account
                    </button>

                </form>

                <hr style="background:white;">

                <div class="text-center">
                    Already have an account?
                    <a href="{% url 'loginuser' %}" class="text-warning font-weight-bold">
                        Login Here
                    </a>
                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}
