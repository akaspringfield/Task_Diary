{% extends "todo/base.html" %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">

        <div class="card shadow-lg border-0"
             style="background: rgba(255,255,255,0.15);
                    backdrop-filter: blur(10px);
                    border-radius:20px;
                    color:white;">

            <div class="card-body p-5">

                <h2 class="text-center font-weight-bold mb-2">
                    👋 Welcome Back
                </h2>

                <p class="text-center mb-4">
                    Sign in to continue managing your tasks and stay productive.
                </p>

                {% if error %}
                <div class="alert alert-danger text-center">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label><strong>Username</strong></label>
                        <input type="text"
                               name="username"
                               class="form-control"
                               id="username"
                               placeholder="Enter your username">
                    </div>

                    <div class="form-group">
                        <label><strong>Password</strong></label>
                        <input type="password"
                               name="password"
                               class="form-control"
                               id="password"
                               placeholder="Enter your password">
                    </div>

                    <button type="submit"
                            class="btn btn-warning btn-block font-weight-bold py-2">
                        🔐 Login
                    </button>

                </form>

                <hr style="background:white;">

                <div class="text-center">
                    New to <strong>Tick Do</strong>?
                    <a href="{% url 'signupuser' %}" class="text-warning font-weight-bold">
                        Create an Account
                    </a>
                </div>

            </div>

        </div>

    </div>
</div>

{% endblock %}
